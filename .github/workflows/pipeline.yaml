name: ci pipeline

on:
  push:
    branches: [ devops ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./devops
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
        
      - name: Install dependencies
        run: npm install
        
      - name: Run tests
        run: npm test
